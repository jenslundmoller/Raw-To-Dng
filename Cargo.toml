[package]
name = "neftodng"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-2.1"
description = "Batch convert Nikon NEF raw files to DNG"

[lib]
name = "neftodng"
path = "src/lib.rs"

[[bin]]
name = "neftodng"
path = "src/main.rs"

[dependencies]
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
async-channel = "2"
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
num_cpus = "1"
rawler = "0.7.2"
rayon = "1"
walkdir = "2"

[profile.release]
opt-level = 3
